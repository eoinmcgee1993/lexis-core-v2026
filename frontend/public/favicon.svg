<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="LEXIS">
  <!-- Rounded-square teal-600 (#0D9488, the app's existing "live" accent —
       see scripts/design/lexis-visual-system.md) background with a white
       five-bar waveform, matching src/components/LexisMark.jsx — the
       brand mark used as the logo badge everywhere else (Landing/Pricing/
       Auth/legal-page headers). Previously a generic four-point sparkle;
       replaced (19 Aug 2026) for reading as generic-AI-product iconography
       rather than anything specific to a voice product — a waveform is
       literal instead: LEXIS's whole product is a live voice conversation. -->
  <rect width="24" height="24" rx="6" fill="#0D9488" />
  <rect x="1.5" y="8" width="3" height="8" rx="1.5" fill="#FFFFFF" />
  <rect x="6" y="5" width="3" height="14" rx="1.5" fill="#FFFFFF" />
  <rect x="10.5" y="2" width="3" height="20" rx="1.5" fill="#FFFFFF" />
  <rect x="15" y="5" width="3" height="14" rx="1.5" fill="#FFFFFF" />
  <rect x="19.5" y="8" width="3" height="8" rx="1.5" fill="#FFFFFF" />
</svg>
