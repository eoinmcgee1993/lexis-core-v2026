<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- This file is ONLY the SPA shell + sitewide metadata now. Anything
         page-specific — title, description, canonical, robots, FAQPage/
         Offers JSON-LD — is set at runtime by each page component via
         frontend/src/lib/useSeo.js, and captured into real static HTML
         per route by frontend/scripts/prerender.mjs (`npm run build`
         runs `vite build` then that script). Before this, every route
         served this file's tags unchanged — including a canonical link
         that pointed /pricing at the homepage, telling Google it was a
         duplicate. See scripts/design/lexis-visual-system.md's sibling
         doc trail and the Digital Renaissance re-audit (17 Aug 2026) for
         the full history of why this file used to be much bigger.

         The title/description below are the LANDING PAGE's values,
         duplicated here (not imported — this is static HTML, no build-
         time templating) as the fallback the un-prerendered dev server
         and the very first paint before React mounts.
         See LandingPage.jsx's useSeo call for the source of truth. -->
    <title>LEXIS | Practice Speaking English & Thai Out Loud</title>
    <meta name="description" content="LEXIS is a voice conversation partner for Thai speakers practicing English and English speakers practicing Thai. Talk out loud, get gentle real-time corrections, and see what to work on next. Free 30-minute trial." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0D9488" />

    <!-- Geo signals — primary audience is Thailand (see backend/app.mjs's
         buildTutorInstructions and README for the product's Thai-youth
         framing). A re-audit noted Google has ignored these specific tags
         for well over a decade — kept anyway since they're harmless, but
         real Thailand SEO comes from hreflang on genuine /th pages (see
         Stage 4 of the remediation brief), Thai-language content, and a
         Business Profile, not this. -->
    <meta name="geo.region" content="TH" />
    <meta name="geo.placename" content="Thailand" />
    <meta name="language" content="English, Thai" />

    <!-- Open Graph / Twitter card defaults — homepage-flavored, since
         this is the one static fallback every route falls back to before
         useSeo overrides it. og:image is the same full-body hero photo
         used on the landing page (see LandingPage.jsx and
         scripts/avatar/lexis-tutor-photo-notes.md's "Marketing hero
         photo" section for provenance). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LEXIS" />
    <meta property="og:title" content="LEXIS | Practice Speaking English & Thai Out Loud" />
    <meta property="og:description" content="A voice conversation partner that listens, replies, and gently corrects you in real time. Practice as much as you want, whenever you want." />
    <meta property="og:url" content="https://lexis-core-v2026.vercel.app/" />
    <meta property="og:image" content="https://lexis-core-v2026.vercel.app/marketing/lexis-tutor-hero.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="th_TH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LEXIS | Practice Speaking English & Thai Out Loud" />
    <meta name="twitter:description" content="A voice conversation partner that listens, replies, and gently corrects you in real time. Practice as much as you want, whenever you want." />
    <meta name="twitter:image" content="https://lexis-core-v2026.vercel.app/marketing/lexis-tutor-hero.jpg" />

    <!-- Organization + SoftwareApplication — the one JSON-LD block that's
         genuinely sitewide-appropriate (per the re-audit: "can stay"),
         so it's static here rather than injected per-route. Everything
         page-specific (Offers, FAQPage) is injected only on the page
         that actually has that content — see
         frontend/src/data/structuredData.js's buildOffersJsonLd/
         buildFaqJsonLd, and PricingPage.jsx/LandingPage.jsx's useSeo
         calls. ORG_ID/APP_ID here must match structuredData.js's
         exported constants if either ever changes — no build step
         generates one from the other yet. No `sameAs` — omitted rather
         than fabricated; add LINE/TikTok/Instagram URLs once they exist. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://lexis-core-v2026.vercel.app/#organization",
          "name": "LEXIS",
          "url": "https://lexis-core-v2026.vercel.app/",
          "areaServed": { "@type": "Country", "name": "Thailand" },
          "knowsLanguage": ["en", "th"]
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://lexis-core-v2026.vercel.app/#software",
          "name": "LEXIS",
          "applicationCategory": "EducationApplication",
          "operatingSystem": "Web",
          "url": "https://lexis-core-v2026.vercel.app/",
          "description": "A voice conversation partner for practicing spoken English and Thai in real time.",
          "publisher": { "@id": "https://lexis-core-v2026.vercel.app/#organization" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
